<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Box Sign Embedded Test</title>
  <style>
    body {
      font-family: Arial;
      padding: 40px;
      background: #f2f2f2;
      text-align: center;
    }
    iframe {
      width: 100%;
      height: 600px;
      border: 1px solid #ccc;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h1>Box Sign: Embedded Signature Request</h1>
  <p>This will send a sign request and embed the signing page below.</p>

  <button onclick="startSignFlow()">Start Signing</button>

  <iframe id="signFrame" style="display:none;"></iframe>

  <script>
    async function startSignFlow() {
      const token = prompt("xFY34WqJvveQERsZaeQ10W9Bdg8ReUBa");
      const fileId = "1849751517040";
      const signerEmail = "gvalentine@totalexpo.com";

      const response = await fetch("https://api.box.com/2.0/sign_requests", {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          is_document_prepared: true,
          signers: [{
            email: signerEmail
          }],
          source_files: [{
            type: "file",
            id: fileId
          }]
        })
      });

      const data = await response.json();

      if (response.ok && data.signers?.[0]?.embed_url) {
        const signFrame = document.getElementById("signFrame");
        signFrame.src = data.signers[0].embed_url;
        signFrame.style.display = "block";
      } else {
        alert("Error creating sign request:\n" + JSON.stringify(data, null, 2));
        console.error(data);
      }
    }
  </script>

</body>
</html>
